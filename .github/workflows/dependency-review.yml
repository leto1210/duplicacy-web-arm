# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request, surfacing known-vulnerable versions of the packages declared or updated in the PR. Once installed, if the workflow run is marked as required, PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
name: 'Dependency Review'
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: 'Compute refs for non-PR runs'
        id: refs
        shell: bash
        run: |
          # Provide explicit refs when workflow is not triggered by pull_request.
          baseRef="${{ github.event.pull_request.base.sha }}"
          headRef="${{ github.event.pull_request.head.sha }}"

          if [ -z "$baseRef" ] || [ -z "$headRef" ]; then
            headRef="${{ github.sha }}"
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              baseRef="$(git rev-parse HEAD^)"
            else
              echo "Impossible de calculer une référence de base (HEAD^ introuvable)." >&2
              exit 1
            fi
          fi

          echo "base=$baseRef" >> "$GITHUB_OUTPUT"
          echo "head=$headRef" >> "$GITHUB_OUTPUT"

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          base-ref: ${{ steps.refs.outputs.base }}
          head-ref: ${{ steps.refs.outputs.head }}
